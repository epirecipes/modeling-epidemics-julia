project:
  type: book
  output-dir: _site
  execute-dir: project
  post-render:
    - quarto render slides
  render:
    - index.qmd
    - setup.qmd
    - workshop.qmd
    - resources.qmd
    - prerequisites/*.qmd
    - chapters/*.qmd
    - appendices/*.qmd
    - references.qmd
  resources:
    - data/**
    - notebook-exports/**
    - notebooks/**/*.jl
    - worksheets/*.qmd

book:
  title: "Modeling Epidemics with Julia"
  page-navigation: true
  chapters:
    - index.qmd
    - setup.qmd
    - workshop.qmd
    - resources.qmd
    - part: "Prerequisites"
      chapters:
        - prerequisites/01-julia-essentials.qmd
        - prerequisites/02-probability-and-stochastic-processes.qmd
        - prerequisites/03-calculus-and-numerical-methods.qmd
    - part: "Core course"
      chapters:
        - chapters/01-foundations.qmd
        - chapters/02-discrete-time-models.qmd
        - chapters/03-ordinary-differential-equations.qmd
        - chapters/04-partial-differential-equations.qmd
        - chapters/05-jump-processes.qmd
        - chapters/06-stochastic-differential-equations.qmd
        - chapters/07-reaction-networks.qmd
        - chapters/08-discrete-event-simulation.qmd
        - chapters/09-agent-based-models.qmd
        - chapters/10-non-exponential-periods.qmd
        - chapters/11-observation-models.qmd
        - chapters/12-parameter-estimation.qmd
        - chapters/13-bayesian-inference.qmd
        - chapters/14-sensitivity-and-identifiability.qmd
        - chapters/15-interventions-and-optimization.qmd
        - chapters/16-advanced-optimal-control.qmd
        - chapters/17-data-to-decision-capstone.qmd
  appendices:
    - appendices/01-universal-differential-equations.qmd
    - appendices/02-probabilistic-numerical-integration.qmd
    - appendices/03-surrogate-models.qmd
    - appendices/04-model-composition.qmd
    - appendices/05-symbolic-analysis.qmd
    - appendices/cheat-sheet.qmd
    - appendices/solutions.qmd
    - appendices/worksheet-solutions.qmd
    - references.qmd

engines: [julia]

julia:
  exeflags: ["--project=@."]

execute:
  freeze: auto

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - styles/book.scss
    code-copy: true
    code-fold: false
    toc: true
