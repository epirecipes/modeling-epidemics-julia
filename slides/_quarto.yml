project:
  type: default
  output-dir: ../_site/slides
  render:
    - prerequisites/*.qmd
    - chapters/*.qmd
    - appendices/*.qmd
    - lectures/*.qmd
  resources:
    - lectures/*.css

bibliography: ../references.bib

engines: [julia]

julia:
  exeflags: ["--project=@."]

execute:
  freeze: auto

format:
  revealjs:
    theme:
      - simple
      - ../styles/slides.scss
    slide-number: true
    code-copy: true
    transition: fade
