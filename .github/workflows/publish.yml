name: Publish course

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-course
  cancel-in-progress: false

jobs:
  publish:
    # Forks of this repository inherit its workflows. Without this, a
    # participant who forks the course and syncs it gets failing runs they
    # have no reason to care about, and an hour-long image build they have no
    # use for.
    if: github.repository == 'epirecipes/modeling-epidemics-julia'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pin Julia version to Manifest.toml
        id: julia-version
        run: echo "version=$(grep -m1 '^julia_version' Manifest.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ steps.julia-version.outputs.version }}

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.28"

      - name: Render frozen course
        env:
          QUARTO_PROFILE: publish
        run: quarto render

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
