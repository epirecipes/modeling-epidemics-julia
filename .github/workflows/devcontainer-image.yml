name: Devcontainer image

# Builds the codespace image with the Julia depot already compiled into it and
# publishes it to GHCR, so that creating a codespace is an image pull of a few
# minutes rather than an hour of precompilation. Codespaces prebuilds would do
# this job, but they need an organisation on a Team or Enterprise plan.
on:
  push:
    branches: [main]
    # Only what actually goes into the image. devcontainer.json, instantiate.sh
    # and xdg-open are read from the workspace when a codespace is created, so
    # editing them does not need an hour of rebuilding; use the Run workflow
    # button if the build itself ever needs re-running by hand.
    paths:
      - .devcontainer/Dockerfile
      - .devcontainer/build-depot.sh
      - Project.toml
      - Manifest.toml
      - environments/ch10/**
      - src/**
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: devcontainer-image
  cancel-in-progress: false

jobs:
  build:
    # Forks of this repository inherit its workflows. Without this, a
    # participant who forks the course and syncs it gets failing runs they
    # have no reason to care about, and an hour-long image build they have no
    # use for.
    if: github.repository == 'epirecipes/modeling-epidemics-julia'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The depot is several gigabytes, and a hosted runner ships with tooling
      # this build has no use for.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}-devcontainer:latest
            ghcr.io/${{ github.repository }}-devcontainer:${{ github.sha }}
          # Without a cache every run recompiles the depot from scratch, an
          # hour even for a one-line change to a later layer. The cache lives
          # in the registry rather than the 10 GB Actions cache, which these
          # layers would not fit in.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-devcontainer:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-devcontainer:buildcache,mode=max

      - name: Report image size
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head
