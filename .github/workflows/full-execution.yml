name: Full course execution

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: full-course-execution
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin Julia version to Manifest.toml
        id: julia-version
        run: echo "version=$(grep -m1 '^julia_version' Manifest.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ steps.julia-version.outputs.version }}

      - uses: julia-actions/cache@v2

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.28"

      - name: Instantiate Julia environment
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=environments/ch10 -e 'using Pkg; Pkg.instantiate()'

      # Whichever unit executes first otherwise captures the worker's
      # precompilation output in its own cell. This discards it instead.
      - name: Warm the notebook worker
        run: |
          cat > warmup.qmd <<'QMD'
          ---
          title: Warmup
          ---

          ```{julia}
          using CairoMakie, DataFrames
          DataFrame(warm = 1:2)
          lines(1:10, collect(1.0:10.0))
          ```
          QMD
          quarto render warmup.qmd
          rm -rf warmup.qmd warmup.html warmup_files _freeze/warmup

      - name: Execute book and slide computations
        env:
          QUARTO_PROFILE: full
        run: quarto render

      - name: Execute and export Pluto notebooks
        env:
          PLUTO_EXPORT_TASKS: "2"
        run: julia --project=. scripts/export_notebooks.jl

      - name: Run validators and tests
        run: |
          julia --project=. scripts/check_structure.jl
          julia --project=. scripts/check_data.jl
          julia --project=. scripts/check_deprecated_apis.jl
          julia --project=. scripts/check_editorial_contract.jl
          julia --project=. scripts/check_pdf_figures.jl
          julia --project=. scripts/check_artifact_sizes.jl
          julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Upload the regenerated freeze
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-freeze
          path: |
            _freeze/**/execute-results/*.json
            slides/_freeze/**/execute-results/*.json
          retention-days: 14

      # Compares content rather than bytes: figures are embedded as base64 PNGs
      # that this Linux runner cannot reproduce byte for byte from a macOS
      # render. notebook-exports is excluded.
      - name: Require current generated artifacts
        run: julia --project=. scripts/check_freeze_drift.jl
